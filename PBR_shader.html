<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <title>PBR Material Editor with Blender Models - Assignment #3</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        
        canvas {
            display: block;
        }
        
        .ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 20px;
            min-width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ui-section {
            margin-bottom: 20px;
        }
        
        .ui-section h3 {
            margin: 0 0 15px 0;
            color: #ff6b6b;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
            text-transform: uppercase;
        }
        
        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
            border: 2px solid #fff;
        }
        
        .slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
            border: 2px solid #fff;
        }
        
        .color-picker, .file-input {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .file-input {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
        }
        
        .file-input:hover {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        
        .value-display {
            display: inline-block;
            float: right;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-family: monospace;
        }
        
        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        
        .preset-btn, .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .preset-btn:hover, .action-btn:hover {
            background: rgba(255, 107, 107, 0.3);
            border-color: #ff6b6b;
        }
        
        .texture-preview {
            width: 60px;
            height: 60px;
            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
            margin-top: 5px;
        }
        
        .texture-grid {
            display: grid;
            grid-template-columns: 1fr 70px;
            gap: 10px;
            align-items: center;
        }
        
        .model-info {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 11px;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-panel h4 {
            margin: 0 0 10px 0;
            color: #4ecdc4;
            font-size: 14px;
        }
        
        .info-panel p {
            margin: 5px 0;
            font-size: 12px;
            color: #aaa;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #ff6b6b;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <!-- UI Panel -->
    <div class="ui-panel">
        <div class="ui-section">
            <h3>📁 Model Loading</h3>
            <input type="file" class="file-input" id="modelInput" accept=".gltf,.glb" placeholder="Load GLTF/GLB Model">
            <button class="action-btn" onclick="loadDefaultModel()" style="width: 100%; margin-top: 10px;">Load Default Model</button>
            <div id="modelInfo" class="model-info" style="display: none;">
                <strong>Model Loaded:</strong> <span id="modelName">-</span><br>
                <strong>Materials:</strong> <span id="materialCount">0</span>
            </div>
        </div>

        <div class="ui-section">
            <h3>🎨 PBR Properties</h3>
            
            <div class="control-group">
                <label class="control-label">
                    Base Color
                    <span class="value-display" id="colorValue">#aaffaa</span>
                </label>
                <input type="color" class="color-picker" id="baseColor" value="#aaffaa">
            </div>
            
            <div class="control-group">
                <label class="control-label">
                    Metallic
                    <span class="value-display" id="metallicValue">0.50</span>
                </label>
                <input type="range" class="slider" id="metallic" min="0" max="1" step="0.01" value="0.5">
            </div>
            
            <div class="control-group">
                <label class="control-label">
                    Roughness
                    <span class="value-display" id="roughnessValue">0.30</span>
                </label>
                <input type="range" class="slider" id="roughness" min="0" max="1" step="0.01" value="0.3">
            </div>

            <div class="control-group">
                <label class="control-label">
                    Normal Strength
                    <span class="value-display" id="normalValue">1.00</span>
                </label>
                <input type="range" class="slider" id="normalScale" min="0" max="2" step="0.05" value="1.0">
            </div>

            <div class="control-group">
                <label class="control-label">
                    Environment Intensity
                    <span class="value-display" id="envValue">1.00</span>
                </label>
                <input type="range" class="slider" id="envIntensity" min="0" max="3" step="0.1" value="1.0">
            </div>
        </div>

        <div class="ui-section">
            <h3>🖼️ Texture Maps</h3>
            
            <div class="control-group">
                <div class="texture-grid">
                    <div>
                        <label class="control-label">Albedo/Diffuse Map</label>
                        <input type="file" class="file-input" id="albedoMap" accept="image/*" style="font-size: 10px; height: 32px;">
                    </div>
                    <canvas class="texture-preview" id="albedoPreview"></canvas>
                </div>
            </div>

            <div class="control-group">
                <div class="texture-grid">
                    <div>
                        <label class="control-label">Normal Map</label>
                        <input type="file" class="file-input" id="normalMap" accept="image/*" style="font-size: 10px; height: 32px;">
                    </div>
                    <canvas class="texture-preview" id="normalPreview"></canvas>
                </div>
            </div>

            <div class="control-group">
                <div class="texture-grid">
                    <div>
                        <label class="control-label">Metallic Map</label>
                        <input type="file" class="file-input" id="metallicMap" accept="image/*" style="font-size: 10px; height: 32px;">
                    </div>
                    <canvas class="texture-preview" id="metallicPreview"></canvas>
                </div>
            </div>

            <div class="control-group">
                <div class="texture-grid">
                    <div>
                        <label class="control-label">Roughness Map</label>
                        <input type="file" class="file-input" id="roughnessMap" accept="image/*" style="font-size: 10px; height: 32px;">
                    </div>
                    <canvas class="texture-preview" id="roughnessPreview"></canvas>
                </div>
            </div>

            <div class="control-group">
                <div class="texture-grid">
                    <div>
                        <label class="control-label">Ambient Occlusion</label>
                        <input type="file" class="file-input" id="aoMap" accept="image/*" style="font-size: 10px; height: 32px;">
                    </div>
                    <canvas class="texture-preview" id="aoPreview"></canvas>
                </div>
            </div>
        </div>

        <div class="ui-section">
            <h3>🔧 Options</h3>
            <div class="control-group">
                <label class="control-label">
                    Auto Rotate Model
                    <label class="toggle-switch" style="float: right;">
                        <input type="checkbox" id="autoRotate" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </label>
            </div>
        </div>
        
        <div class="ui-section">
            <h3>⚡ Presets</h3>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="applyPreset('chrome')">Chrome</button>
                <button class="preset-btn" onclick="applyPreset('gold')">Gold</button>
                <button class="preset-btn" onclick="applyPreset('plastic')">Plastic</button>
                <button class="preset-btn" onclick="applyPreset('rubber')">Rubber</button>
                <button class="preset-btn" onclick="applyPreset('ceramic')">Ceramic</button>
                <button class="preset-btn" onclick="applyPreset('wood')">Wood</button>
            </div>
        </div>
    </div>
    
    <!-- Info Panel -->
    <div class="info-panel">
        <h4>🔧 Controls</h4>
        <p><strong>Mouse:</strong> Orbit camera</p>
        <p><strong>Wheel:</strong> Zoom in/out</p>
        <p><strong>Models:</strong> GLTF/GLB from Blender</p>
        <p><strong>Textures:</strong> PNG/JPG supported</p>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        // Orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Environment map
        const envMapUrls = [
            'https://threejs.org/examples/textures/cube/Bridge2/posx.jpg',
            'https://threejs.org/examples/textures/cube/Bridge2/negx.jpg',
            'https://threejs.org/examples/textures/cube/Bridge2/posy.jpg',
            'https://threejs.org/examples/textures/cube/Bridge2/negy.jpg',
            'https://threejs.org/examples/textures/cube/Bridge2/posz.jpg',
            'https://threejs.org/examples/textures/cube/Bridge2/negz.jpg'
        ];
        
        const envMap = new THREE.CubeTextureLoader().load(envMapUrls);
        envMap.encoding = THREE.sRGBEncoding;
        scene.environment = envMap;

        // Lighting setup
        const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const rimLight = new THREE.DirectionalLight(0x4ecdc4, 0.5);
        rimLight.position.set(-3, 2, -2);
        scene.add(rimLight);

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x333333, 
            roughness: 0.8,
            metalness: 0.0
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        scene.add(ground);

        // Default sphere object
        let currentModel = null;
        let currentMaterials = [];

        function createDefaultSphere() {
            const sphereGeometry = new THREE.SphereGeometry(0.8, 64, 64);
            const pbrMaterial = new THREE.MeshStandardMaterial({
                color: 0xaaffaa,
                metalness: 0.5,
                roughness: 0.3,
                envMap: envMap,
                envMapIntensity: 1.0
            });
            
            const sphere = new THREE.Mesh(sphereGeometry, pbrMaterial);
            currentMaterials = [pbrMaterial];
            return sphere;
        }

        currentModel = createDefaultSphere();
        scene.add(currentModel);

        // GLTF Loader
        const gltfLoader = new THREE.GLTFLoader();

        // UI Elements
        const baseColorPicker = document.getElementById('baseColor');
        const metallicSlider = document.getElementById('metallic');
        const roughnessSlider = document.getElementById('roughness');
        const normalScaleSlider = document.getElementById('normalScale');
        const envIntensitySlider = document.getElementById('envIntensity');
        const autoRotateCheckbox = document.getElementById('autoRotate');
        
        const colorValue = document.getElementById('colorValue');
        const metallicValue = document.getElementById('metallicValue');
        const roughnessValue = document.getElementById('roughnessValue');
        const normalValue = document.getElementById('normalValue');
        const envValue = document.getElementById('envValue');

        // Texture inputs
        const albedoMapInput = document.getElementById('albedoMap');
        const normalMapInput = document.getElementById('normalMap');
        const metallicMapInput = document.getElementById('metallicMap');
        const roughnessMapInput = document.getElementById('roughnessMap');
        const aoMapInput = document.getElementById('aoMap');

        // Model loading
        const modelInput = document.getElementById('modelInput');
        const modelInfo = document.getElementById('modelInfo');
        const modelNameSpan = document.getElementById('modelName');
        const materialCountSpan = document.getElementById('materialCount');

        // Update material function
        function updateMaterial() {
            const color = new THREE.Color(baseColorPicker.value);
            const metallic = parseFloat(metallicSlider.value);
            const roughness = parseFloat(roughnessSlider.value);
            const normalScale = parseFloat(normalScaleSlider.value);
            const envIntensity = parseFloat(envIntensitySlider.value);
            
            currentMaterials.forEach(material => {
                if (material.isMeshStandardMaterial) {
                    material.color = color.clone();
                    material.metalness = metallic;
                    material.roughness = roughness;
                    material.envMapIntensity = envIntensity;
                    
                    if (material.normalMap && material.normalScale) {
                        material.normalScale.set(normalScale, normalScale);
                    }
                }
            });
            
            // Update display values
            colorValue.textContent = baseColorPicker.value;
            metallicValue.textContent = metallic.toFixed(2);
            roughnessValue.textContent = roughness.toFixed(2);
            normalValue.textContent = normalScale.toFixed(2);
            envValue.textContent = envIntensity.toFixed(2);
        }

        // Load texture and create preview
        function loadTexture(file, material, property, previewCanvasId) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const textureLoader = new THREE.TextureLoader();
                textureLoader.load(event.target.result, function(texture) {
                    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
                    texture.encoding = (property === 'map') ? THREE.sRGBEncoding : THREE.LinearEncoding;
                    
                    currentMaterials.forEach(mat => {
                        if (mat.isMeshStandardMaterial) {
                            mat[property] = texture;
                            
                            // Special handling for normal maps
                            if (property === 'normalMap') {
                                mat.normalScale = new THREE.Vector2(parseFloat(normalScaleSlider.value), parseFloat(normalScaleSlider.value));
                            }
                            
                            mat.needsUpdate = true;
                        }
                    });
                    
                    // Create preview
                    createTexturePreview(event.target.result, previewCanvasId);
                });
            };
            reader.readAsDataURL(file);
        }

        // Create texture preview
        function createTexturePreview(imageSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                canvas.width = 60;
                canvas.height = 60;
                ctx.drawImage(img, 0, 0, 60, 60);
            };
            img.src = imageSrc;
        }

        // Load model function
        function loadModel(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const arrayBuffer = event.target.result;
                
                gltfLoader.parse(arrayBuffer, '', function(gltf) {
                    // Remove current model
                    if (currentModel) {
                        scene.remove(currentModel);
                    }
                    
                    currentModel = gltf.scene;
                    currentMaterials = [];
                    
                    // Collect all materials
                    currentModel.traverse(function(child) {
                        if (child.isMesh && child.material) {
                            if (Array.isArray(child.material)) {
                                currentMaterials.push(...child.material);
                            } else {
                                currentMaterials.push(child.material);
                            }
                        }
                    });
                    
                    // Set up materials for PBR
                    currentMaterials.forEach(material => {
                        if (material.isMeshStandardMaterial) {
                            material.envMap = envMap;
                        }
                    });
                    
                    // Scale and position model
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 1.5 / maxDim;
                    currentModel.scale.setScalar(scale);
                    
                    // Center model
                    const center = box.getCenter(new THREE.Vector3());
                    currentModel.position.sub(center.multiplyScalar(scale));
                    
                    scene.add(currentModel);
                    
                    // Update UI
                    modelInfo.style.display = 'block';
                    modelNameSpan.textContent = file.name;
                    materialCountSpan.textContent = currentMaterials.length;
                    
                    // Apply current settings
                    updateMaterial();
                    
                }, function(error) {
                    console.error('Error parsing GLTF:', error);
                    alert('Error loading model. Please check if it\'s a valid GLTF/GLB file.');
                });
            };
            reader.readAsArrayBuffer(file);
        }

        // Load default model (demo)
        function loadDefaultModel() {
            // Create a more complex default model
            if (currentModel) {
                scene.remove(currentModel);
            }
            
            const group = new THREE.Group();
            
            // Main sphere
            const sphereGeometry = new THREE.SphereGeometry(0.5, 32, 32);
            const sphereMaterial = new THREE.MeshStandardMaterial({
                color: 0x4fc3f7,
                metalness: 0.7,
                roughness: 0.2,
                envMap: envMap,
                envMapIntensity: 1.0
            });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.y = 0.5;
            group.add(sphere);
            
            // Base cylinder
            const cylinderGeometry = new THREE.CylinderGeometry(0.6, 0.8, 0.3, 16);
            const cylinderMaterial = new THREE.MeshStandardMaterial({
                color: 0xff7043,
                metalness: 0.1,
                roughness: 0.8,
                envMap: envMap,
                envMapIntensity: 0.5
            });
            const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
            cylinder.position.y = 0.15;
            group.add(cylinder);
            
            currentModel = group;
            currentMaterials = [sphereMaterial, cylinderMaterial];
            scene.add(currentModel);
            
            // Update UI
            modelInfo.style.display = 'block';
            modelNameSpan.textContent = 'Default Model';
            materialCountSpan.textContent = currentMaterials.length;
        }

        // Event listeners
        baseColorPicker.addEventListener('input', updateMaterial);
        metallicSlider.addEventListener('input', updateMaterial);
        roughnessSlider.addEventListener('input', updateMaterial);
        normalScaleSlider.addEventListener('input', updateMaterial);
        envIntensitySlider.addEventListener('input', updateMaterial);

        // Model loading
        modelInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                loadModel(file);
            }
        });

        // Texture loading
        albedoMapInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) loadTexture(file, null, 'map', 'albedoPreview');
        });

        normalMapInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) loadTexture(file, null, 'normalMap', 'normalPreview');
        });

        metallicMapInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) loadTexture(file, null, 'metalnessMap', 'metallicPreview');
        });

        roughnessMapInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) loadTexture(file, null, 'roughnessMap', 'roughnessPreview');
        });

        aoMapInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) loadTexture(file, null, 'aoMap', 'aoPreview');
        });

        // Preset materials
        const presets = {
            chrome: { color: '#c0c0c0', metallic: 1.0, roughness: 0.05 },
            gold: { color: '#ffd700', metallic: 1.0, roughness: 0.1 },
            plastic: { color: '#ff4444', metallic: 0.0, roughness: 0.5 },
            rubber: { color: '#333333', metallic: 0.0, roughness: 0.9 },
            ceramic: { color: '#f0f0f0', metallic: 0.0, roughness: 0.1 },
            wood: { color: '#8b4513', metallic: 0.0, roughness: 0.8 }
        };

        function applyPreset(presetName) {
            const preset = presets[presetName];
            if (preset) {
                baseColorPicker.value = preset.color;
                metallicSlider.value = preset.metallic;
                roughnessSlider.value = preset.roughness;
                updateMaterial();
            }
        }

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Auto rotation
            if (autoRotateCheckbox.checked && currentModel) {
                currentModel.rotation.y += 0.005;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Initialize
        updateMaterial();
        animate();
    </script>
</body>
</html>
