<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>GLB Model Loader (three.js r128)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,body{height:100%;margin:0;font-family:Arial,sans-serif} 
    canvas{display:block}
    #info{position:absolute;top:10px;left:10px;color:white;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;font-size:14px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="info">
  กำลังโหลดโมเดล 3D...<br>
  <small>คลิกหน้าจอเพื่อเริ่มเล่น</small>
</div>

<script>
  // Scene / Camera / Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);

  const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 3, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // FPS Controls
  let moveForward = false, moveBackward = false;
  let moveLeft = false, moveRight = false;
  let velocity = new THREE.Vector3();
  let direction = new THREE.Vector3();
  const speed = 10.0;
  
  // Mouse look
  let yaw = 0, pitch = 0;
  let isPointerLocked = false;
  
  // Pointer Lock
  renderer.domElement.addEventListener('click', () => {
    renderer.domElement.requestPointerLock();
  });
  
  document.addEventListener('pointerlockchange', () => {
    isPointerLocked = document.pointerLockElement === renderer.domElement;
    if (isPointerLocked) {
      document.getElementById('info').innerHTML = `
        โหลดเสร็จแล้ว - กำลังเล่น<br>
        <small>WASD: เดิน | เมาส์: มองรอบตัว | ESC: ปลดล็อก</small>
      `;
    } else {
      document.getElementById('info').innerHTML = `
        คลิกหน้าจอเพื่อเริ่มเล่น<br>
        <small>WASD: เดิน | เมาส์: มองรอบตัว</small>
      `;
    }
  });
  
  document.addEventListener('mousemove', (e) => {
    if (!isPointerLocked) return;
    
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
    
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  });
  
  // Keyboard
  document.addEventListener('keydown', (e) => {
    switch(e.code) {
      case 'KeyS': moveForward = true; break;
      case 'KeyW': moveBackward = true; break;
      case 'KeyA': moveLeft = true; break;
      case 'KeyD': moveRight = true; break;
    }
  });
  
  document.addEventListener('keyup', (e) => {
    switch(e.code) {
      case 'KeyS': moveForward = false; break;
      case 'KeyW': moveBackward = false; break;
      case 'KeyA': moveLeft = false; break;
      case 'KeyD': moveRight = false; break;
    }
  });

  // สร้างพื้น
  const floorGeometry = new THREE.PlaneGeometry(20, 20);
  const floorMaterial = new THREE.MeshStandardMaterial({ 
    color: 0x404040,
    roughness: 0.8,
    metalness: 0.2
  });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // แสงสว่าง - เพิ่มความสว่างและหลากหลาย
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  // แสงหลักจากด้านบน
  const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
  directionalLight.position.set(5, 10, 5);
  directionalLight.castShadow = true;
  directionalLight.shadow.mapSize.width = 2048;
  directionalLight.shadow.mapSize.height = 2048;
  directionalLight.shadow.camera.near = 0.5;
  directionalLight.shadow.camera.far = 50;
  directionalLight.shadow.camera.left = -10;
  directionalLight.shadow.camera.right = 10;
  directionalLight.shadow.camera.top = 10;
  directionalLight.shadow.camera.bottom = -10;
  scene.add(directionalLight);

  // แสงเสริมด้านข้าง
  const sideLight1 = new THREE.DirectionalLight(0xffd4a3, 0.5);
  sideLight1.position.set(-5, 5, 0);
  scene.add(sideLight1);

  const sideLight2 = new THREE.DirectionalLight(0xa3c4ff, 0.4);
  sideLight2.position.set(5, 3, -5);
  scene.add(sideLight2);

  // แสง Point Light เพิ่มบรรยากาศ
  const pointLight1 = new THREE.PointLight(0xffffff, 0.8, 20);
  pointLight1.position.set(3, 4, 3);
  scene.add(pointLight1);

  const pointLight2 = new THREE.PointLight(0xffffff, 0.6, 15);
  pointLight2.position.set(-3, 3, -3);
  scene.add(pointLight2);

  // Environment map
  const cubeUrls = [
    'https://threejs.org/examples/textures/cube/Bridge2/posx.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/negx.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/posy.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/negy.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/posz.jpg',
    'https://threejs.org/examples/textures/cube/Bridge2/negz.jpg'
  ];
  const envMap = new THREE.CubeTextureLoader().load(cubeUrls);
  envMap.encoding = THREE.sRGBEncoding;
  scene.environment = envMap;

  // โหลดโมเดล GLB
  const loader = new THREE.GLTFLoader();
  let model = null;
  
  // ตัวอย่าง URL ของโมเดล GLB (เปลี่ยนเป็น URL ของไฟล์ .glb ที่คุณต้องการ)
  const modelUrl = 'https://hlangkaa.github.io/ICG/Portfolio/Model/Profile-4.glb';
  
  loader.load(
    modelUrl,
    function (gltf) {
      model = gltf.scene;
      
      // ตั้งค่าให้โมเดลอยู่บนพื้น
      model.position.y = 0;
      model.scale.setScalar(150); // ปรับขนาดถ้าต้องการ
      
      // เปิดใช้งานเงา
      model.traverse(function (child) {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      
      scene.add(model);
      
      // อัปเดต UI
      document.getElementById('info').innerHTML = `
        คลิกหน้าจอเพื่อเริ่มเล่น<br>
        <small>WASD: เดิน | เมาส์: มองรอบตัว</small>
      `;
      
      console.log('โมเดล GLB โหลดสำเร็จ:', gltf);
    },
    function (progress) {
      const percent = (progress.loaded / progress.total * 100).toFixed(0);
      document.getElementById('info').innerHTML = `
        กำลังโหลดโมเดล 3D... ${percent}%<br>
        <small>คลิกหน้าจอเพื่อเริ่มเล่น</small>
      `;
    },
    function (error) {
      console.error('เกิดข้อผิดพลาดในการโหลดโมเดล:', error);
      document.getElementById('info').innerHTML = `
        เกิดข้อผิดพลาดในการโหลดโมเดล<br>
        <small>กรุณาตรวจสอบ URL ของไฟล์</small>
      `;
    }
  );

  // การปรับขนาดหน้าจอ
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // วงจรเรนเดอร์
  const clock = new THREE.Clock();
  
  function animate() {
    const delta = clock.getDelta();
    
    if (isPointerLocked) {
      // คำนวณทิศทาง
      direction.z = Number(moveForward) - Number(moveBackward);
      direction.x = Number(moveRight) - Number(moveLeft);
      direction.normalize();
      
      // เคลื่อนที่
      velocity.x = direction.x * speed * delta;
      velocity.z = direction.z * speed * delta;
      
      // Apply movement relative to camera direction
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      
      const right = new THREE.Vector3();
      right.crossVectors(forward, camera.up);
      
      camera.position.addScaledVector(forward, -velocity.z);
      camera.position.addScaledVector(right, velocity.x);
      
      // จำกัดพื้นที่ (ไม่ให้ออกนอกพื้น)
      camera.position.x = Math.max(-9, Math.min(9, camera.position.x));
      camera.position.z = Math.max(-9, Math.min(9, camera.position.z));
      camera.position.y = 4; // ความสูงของสายตา
    }
    
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  
  animate();
</script>
</body>
</html>
